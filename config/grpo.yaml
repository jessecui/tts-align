# GRPO hyperparameters. Used by scripts/04_train_grpo.py.
#
# GRPO is online: every step samples fresh rollouts from the policy, runs the
# reward function on each, computes group-relative advantages, and updates.
# More finicky than DPO/KTO — expect to tune `beta` (KL coefficient) before
# committing to a full run.

seed: 42
model_id: "OuteAI/Llama-OuteTTS-1.0-1B"
dataset_path: "data/dataset.parquet"
reference_audio_path: "data/generated/reference_speaker.wav"

# LoRA. Rank/alpha/targets match DPO/KTO for an apples-to-apples LoRA budget.
#
# Dropout is 0.0 here (vs 0.05 for DPO/KTO). TRL's GRPOTrainer calls
# model.generate while the model is in train() mode, so nonzero lora_dropout
# fires on every rollout and adds noise to the generated audio. PEFT's default
# for online RL is 0.0 for this reason.
#
# A sibling run at 0.05 scored marginally higher composite on a single seed,
# but 0.0 is kept because (a) rollout-consistency is the methodological standard
# and (b) the 0.05 advantage was within seed noise. See the GRPO notes section
# of the README for the full investigation.
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Reward. Weights are RELATIVE — group-z normalization in GRPO removes the
# absolute scale, so the 0.6/0.4/0.3 ratios are what matter (not the sum).
reward_weights:
  wer: 0.6
  utmos: 0.4
  speaker_sim: 0.3

# GRPO core
beta: 0.05               # KL coefficient — start here, halve/double for tuning
num_generations: 8       # group size K (rollouts per prompt). K=8 stabilizes the
                         # group-relative baseline vs K=4: each rollout's advantage
                         # is computed against a 7-sample mean instead of a noisy
                         # 3-sample mean, which is the original review's "K=4 is
                         # too small at low temperature" concern addressed directly.
num_iterations: 1        # gradient updates per rollout batch (1 = on-policy)

# scale_rewards=False (Dr. GRPO recommendation). At temperature 0.4 with K=4
# rollouts, groups frequently collapse to near-identical rewards; dividing by a
# tiny std then amplifies Whisper/UTMOS measurement noise into full-magnitude
# ±1 advantages. Keeping the unscaled (R - mean) signal is more robust in this
# low-diversity regime and also avoids the std-scaling bias toward low-variance
# prompts that the Dr. GRPO paper identifies.
scale_rewards: false

# Optimization — smaller LR than DPO/KTO because online RL is noisier.
#
# Effective batch math: TRL requires
#     (per_device_train_batch_size × grad_accum × num_processes) % num_generations == 0
# and the prompts-per-optimizer-step is that quantity divided by num_generations.
# Single-GPU: 1 × 32 / 8 = 4 prompts per step (32 completions per step).
#
# The original 200-step run was 1 prompt × 200 steps = 200 prompts × 4 rollouts =
# 800 rollouts. This config is 4 prompts × 50 steps × 8 rollouts = 1600 rollouts —
# 2× the compute, spent on doubling the group size K rather than on more steps.
# Pairs with scale_rewards=False above and the earlier accum bump (4→16→32) —
# all three target the same diagnosis that the previous run's gradient signal
# was dominated by per-prompt reward noise.
max_steps: 50
learning_rate: 5.0e-6
batch_size: 1            # per-device COMPLETIONS; must be divisible by num_generations
grad_accum: 32
warmup_ratio: 0.05
max_prompt_length: 4096       # speaker reference is ~600 tokens; 4k leaves room
max_completion_length: 2048   # OuteTTS audio sequences are long

# Generation — OuteTTS 1.0 canonical settings except for temperature.
# top_p, top_k, and repetition_penalty are kept at OuteTTS's documented values
# (repetition_penalty=1.1 in particular triggers the
# RepetitionPenaltyLogitsProcessorPatch outetts monkey-patches into transformers
# with a 64-token window — needed to keep the model producing audio codec
# tokens rather than English text).
#
# Temperature is raised to 0.7 to match the evaluation temperature. This avoids
# the train/eval distribution mismatch that arises when GRPO samples rollouts
# at one temperature but is evaluated at another: the policy learned at 0.4
# does not transfer cleanly to 0.7-sample audio. Matching the two eliminates
# that confound and makes the GRPO result directly comparable to DPO/KTO/base.
temperature: 0.7
top_p: 0.9
top_k: 40
repetition_penalty: 1.1
# min_p: 0.05  # uncomment if your TRL version supports it in GRPOConfig

# vLLM for fast sampling.
# Default off because TRL 0.16+'s GRPOTrainer expects an external vLLM server
# (`trl vllm-serve`), not the in-process vLLM the project originally targeted.
# Plain transformers.generate works and is what was used for the published run.
# See `./run.sh vllm-check` if you want to confirm vLLM is available standalone.
use_vllm: false
vllm_gpu_memory_utilization: 0.4   # leave ~24 GB for the training model + reward stack

# Logging & checkpointing
output_dir: "runs/grpo"
logging_steps: 1
save_steps: 50
